services:
  dev:
    build: { context: ., target: dev }
    ports: ["8787:8787"]
    volumes:
      - .:/repo
      - dev-node-modules:/repo/worker/node_modules
    environment:
      - TYPESAFE_API_KEY
      - DAILY_CAP # unset: the Worker uses 5000

  prod:
    build: { context: ., target: prod }
    ports: ["8788:8787"]
    volumes:
      - prod-count:/data
    environment:
      - TYPESAFE_API_KEY
      - DAILY_CAP # unset: the Worker uses 5000

volumes:
  dev-node-modules:
  prod-count:
