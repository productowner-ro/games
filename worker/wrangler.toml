# One Worker serves the three games as static assets and runs /api/*.
name = "games"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Cloudflare creates the DNS record and the certificate of a Custom Domain (issue #7).
routes = [ { pattern = "games.productowner.ro", custom_domain = true } ]

[assets]
directory = "../areas"
run_worker_first = ["/api/*"]

# The daily count of Jev calls for the whole site (issue #5).
[[durable_objects.bindings]]
name = "JEV_COUNT"
class_name = "JevCount"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JevCount"]

# The game log: one row per log line (issue #12). The table is in migrations/.
[[d1_databases]]
binding = "LOG"
database_name = "games-log"
database_id = "3fd85b88-c849-466d-8012-82be08e00901"
migrations_dir = "migrations"
