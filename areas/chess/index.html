<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chess</title>
<style>
  body { margin: 0; background: #111; color: #eee; font-family: system-ui, sans-serif;
         display: flex; justify-content: center; align-items: flex-start; padding-top: 30px; }
  .wrap { display: flex; gap: 20px; }
  canvas { border: 2px solid #444; cursor: pointer; }
  .side { width: 200px; }
  .side h3 { margin: 12px 0 6px; font-size: 14px; color: #aaa; text-transform: uppercase; }
  .stat { font-size: 22px; font-weight: bold; }
  .keys { font-size: 12px; color: #888; line-height: 1.6; margin-top: 16px; }
  #moves { font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.6;
           height: 420px; overflow-y: auto; background: #1a1a1a; padding: 6px 8px; }
  #moves .n { color: #777; display: inline-block; width: 32px; }
  #moves .m { display: inline-block; width: 64px; }
  #promo { display: none; gap: 6px; }
  #promo button { font-size: 32px; width: 44px; height: 44px; line-height: 1; padding: 0;
                  background: #333; color: #eee; border: 1px solid #555; cursor: pointer; }
  #msg { position: absolute; top: 45%; width: 564px; text-align: center; font-size: 28px; font-weight: bold;
         text-shadow: 0 0 6px #000, 0 0 12px #000; pointer-events: none; }
  .board { position: relative; }
  .semaphore { font-size: 12px; line-height: 1.6; margin-top: 4px; }
  .semaphore::before { content: "\25CF  "; }
  .semaphore.green::before { color: #2ecc71; }
  .semaphore.yellow::before { color: #f1c40f; }
  .semaphore.red::before { color: #e74c3c; }
  .semaphore.grey { color: #888; }
</style>
</head>
<body>
<div class="wrap">
  <div class="side">
    <h3>Turn</h3><div class="stat" id="turn">White</div>
    <h3>Status</h3><div id="status">Game on.</div>
    <div id="promo-wrap"><h3>Promote to</h3><div id="promo"></div></div>
    <div class="keys">
      Click a piece, then a square<br>U undo<br>F flip board<br>R restart<br>A autoplay (two Jev bots)
    </div>
    <h3>Bots</h3><div class="keys" id="bot-status">Autoplay off.</div>
    <h3>Jev today</h3><div class="semaphore grey" id="semaphore"></div>
    <h3>White bot</h3><div class="keys" id="bot-w"></div>
    <h3>Black bot</h3><div class="keys" id="bot-b"></div>
  </div>
  <div class="board">
    <canvas id="game" width="560" height="560"></canvas>
    <div id="msg"></div>
  </div>
  <div class="side">
    <h3>Moves</h3><div id="moves"></div>
  </div>
</div>
<script src="../jev.js"></script>
<script src="chess.js"></script>
</body>
</html>
