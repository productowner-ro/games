<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mitropoly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;500;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #140d0a; --night-2: #1f1511; --night-3: #2b1e17;
    --parchment: #f4ead3; --parchment-2: #e9dcbd; --ink: #2a1b10; --ink-soft: #5e4630;
    --gold: #d4a93a; --gold-hi: #f1d27a; --oxblood: #7a1717;
    --news: #e30613; --news-strip: #ffd200;
    --text: #f3e9d4; --muted: #bfae8c;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --panel-w: 330px; --gap: 16px;
    --bs: min(calc(100vh - 2 * var(--gap)), calc(100vw - 3 * var(--gap) - var(--panel-w)), 980px);
    --u: calc(var(--bs) / 100);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--text); overflow: hidden;
    background: radial-gradient(ellipse at 40% 50%, #3a2412 0%, var(--night) 60%) fixed, var(--night);
    font: 15px/1.4 "Alegreya Sans", system-ui, sans-serif; }
  ::selection { background: var(--gold); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #4a3626; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  * { scrollbar-color: #4a3626 transparent; scrollbar-width: thin; }
  svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.75;
    stroke-linecap: round; stroke-linejoin: round; flex: none; }
  [hidden] { display: none !important; }

  /* ---------- buttons ---------- */
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid transparent;
    transition: transform .12s var(--ease-out), background-color .15s, opacity .15s; }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btn { padding: .55em 1.1em; font-weight: 800; letter-spacing: .01em; }
  .btn.primary { background: var(--oxblood); color: var(--parchment); border-color: #a33a2a;
    box-shadow: 0 3px 10px rgba(60, 10, 5, .35); }
  .btn.primary:hover:not(:disabled) { background: #8f1f1c; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: rgba(42, 27, 16, .35); }
  .btn.ghost:hover:not(:disabled) { background: rgba(42, 27, 16, .07); }
  .kbd { font-size: .75em; font-weight: 500; opacity: .75; margin-left: .5em; }

  /* ---------- setup ---------- */
  .setup { height: 100%; display: grid; place-items: center; padding: var(--gap); }
  .setup-card { width: min(440px, 100%); text-align: center; }
  .logo { font-family: Cinzel, serif; font-weight: 800; letter-spacing: .08em; margin: 0; line-height: 1; }
  .setup .logo { font-size: clamp(40px, 8vw, 64px); color: var(--gold-hi);
  }
  .setup .tag { color: var(--muted); font-style: italic; margin: 10px 0 30px; font-size: 17px; }
  .seg { display: inline-flex; border: 1px solid #5a432f; border-radius: 10px; padding: 3px; gap: 3px; margin-bottom: 18px; }
  .seg button { background: transparent; color: var(--muted); padding: 6px 16px; font-weight: 700; }
  .seg button[aria-checked="true"] { background: var(--gold); color: var(--ink); }
  .field { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .field .dot { width: 16px; height: 16px; border-radius: 50%; flex: none; box-shadow: 0 1px 3px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.7); }
  .field input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #5a432f;
    background: var(--night-2); color: var(--text); font: inherit; }
  .field input:focus { border-color: var(--gold); outline: none; }
  .setup .btn.primary { width: 100%; margin-top: 22px; font-size: 18px; padding: 12px; }
  .disclaimer { font-size: 13px; color: var(--muted); margin-top: 16px; }

  /* ---------- game layout ---------- */
  .game { height: 100%; display: flex; gap: var(--gap); padding: var(--gap); justify-content: center; align-items: center; }
  .board { position: relative; width: var(--bs); height: var(--bs); flex: none; display: grid;
    grid-template-columns: 1.6fr repeat(9, 1fr) 1.6fr; grid-template-rows: 1.6fr repeat(9, 1fr) 1.6fr;
    background: var(--parchment); color: var(--ink); border: 2px solid var(--gold); border-radius: 6px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .6), 0 0 0 6px #2a1c12, 0 0 0 7px #5a432f; }

  /* ---------- cells ---------- */
  .cell { position: relative; border: 1px solid rgba(42, 27, 16, .3); display: flex; flex-direction: column;
    font-size: max(8px, calc(var(--u) * 1.05)); line-height: 1.12; text-align: center; overflow: hidden;
    background: var(--parchment); cursor: pointer; transition: background-color .15s; }
  .cell:hover { background: #fbf4e2; }
  .cell.side-left { flex-direction: row-reverse; }
  .cell.side-top { flex-direction: column-reverse; }
  .cell.side-right { flex-direction: row; }
  .cell .bar { flex: 0 0 22%; display: flex; align-items: center; justify-content: center; gap: 1px; color: #fff; }
  .cell.side-left .bar, .cell.side-right .bar { flex-direction: column; }
  .cell .bar svg { width: calc(var(--u) * 1.5); height: calc(var(--u) * 1.5); stroke-width: 2.4; animation: pop .35s var(--ease-out); }
  .cell .bar svg.big { width: calc(var(--u) * 2.2); height: calc(var(--u) * 2.2); }
  .cell .body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 3px 2px; min-width: 0; }
  .cell .nm { font-weight: 700; hyphens: auto; }
  .cell .pr { color: var(--ink-soft); font-weight: 500; font-variant-numeric: tabular-nums; }
  .cell .ic { font-size: calc(var(--u) * 2.6); color: var(--oxblood); }
  .cell.corner .nm { font-family: Cinzel, serif; font-size: 1.15em; }
  .cell.corner .ic { font-size: calc(var(--u) * 4.2); }
  .cell.owned::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 3px var(--own); }
  .cell.mort .body { background: repeating-linear-gradient(135deg, transparent 0 5px, rgba(42,27,16,.12) 5px 7px); color: var(--ink-soft); }
  .cell.sel { background: #fff6d8; }
  .cell.sel::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
    box-shadow: inset 0 0 0 2px var(--gold); }
  .stamp { position: absolute; left: 50%; top: 50%; z-index: 3; pointer-events: none;
    font: 700 calc(var(--u) * 1.5) Oswald, sans-serif; letter-spacing: .06em; padding: 2px 4px;
    color: var(--own); border: 2px solid var(--own); border-radius: 3px; background: rgba(255,255,255,.85);
    animation: stamp 1.1s var(--ease-out) forwards; }
  @keyframes stamp {
    0% { transform: translate(-50%, -50%) rotate(-14deg) scale(2.4); opacity: 0; }
    25% { transform: translate(-50%, -50%) rotate(-14deg) scale(1); opacity: 1; }
    75% { opacity: 1; }
    100% { transform: translate(-50%, -50%) rotate(-14deg) scale(1); opacity: 0; }
  }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

  /* jail bars over the Rahova corner */
  .bars { position: absolute; right: 7%; bottom: 7%; width: 54%; height: 50%; border: 2px solid var(--ink);
    border-radius: 3px; background: rgba(122, 23, 23, .08); pointer-events: none;
    background-image: repeating-linear-gradient(90deg, transparent 0 calc(20% - 2px), var(--ink) calc(20% - 2px) 20%); }
  .bars.drop { animation: drop .6s var(--ease-out); }
  @keyframes drop { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }

  /* ---------- tokens ---------- */
  .tokens { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .token { position: absolute; left: 0; top: 0; width: calc(var(--u) * 2.6); height: calc(var(--u) * 2.6); }
  .token span { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--c);
    box-shadow: 0 2px 4px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.85), inset 0 -3px 4px rgba(0,0,0,.25); }
  .token.active::after { content: ""; position: absolute; inset: -3px; border-radius: 50%;
    border: 2px solid var(--gold-hi); animation: halo 1.8s ease-out infinite; }
  @keyframes halo { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.7); opacity: 0; } }

  /* ---------- center: the altar, one column read top to bottom ---------- */
  .altar { grid-row: 2 / 11; grid-column: 2 / 11; display: flex; flex-direction: column; align-items: center;
    padding: calc(var(--u) * 2.5) calc(var(--u) * 3); min-height: 0;
    background: radial-gradient(ellipse at 50% 45%, #fbf3df 0%, var(--parchment-2) 100%);
    font-size: max(12px, calc(var(--u) * 1.75)); }
  .altar .logo { color: var(--oxblood); font-size: calc(var(--u) * 4); opacity: .8; margin-bottom: calc(var(--u) * 1.5); }
  .focus { flex: 1; min-height: 0; width: min(100%, calc(var(--u) * 58)); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: calc(var(--u) * 2.4); }

  .who { text-align: center; }
  .who b { display: inline-flex; align-items: center; gap: .4em; font: 800 calc(var(--u) * 3.2)/1.1 Cinzel, serif; color: var(--ink); }
  .who b i { width: .55em; height: .55em; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px rgba(255,255,255,.8), 0 1px 3px rgba(0,0,0,.4); }
  .who span { display: block; color: var(--ink-soft); margin-top: .3em; }
  .who.change { animation: deal .4s var(--ease-out); }

  .news { width: 100%; display: flex; align-items: stretch; min-height: calc(var(--u) * 6.4);
    border-radius: 4px; overflow: hidden; background: rgba(255, 253, 246, .7); border: 1px solid #dccca6; }
  .news .tag { display: none; }
  .news .txt { flex: 1; padding: .45em .9em; color: var(--ink); display: flex; align-items: center;
    justify-content: center; text-align: center; line-height: 1.3; }
  .news.loud { border-color: transparent; box-shadow: 0 6px 16px rgba(42, 27, 16, .25); }
  .news.loud .tag { display: flex; background: var(--tagc, var(--news)); color: #fff; font: 700 1em Oswald, sans-serif;
    letter-spacing: .06em; text-transform: uppercase; padding: .4em .8em; align-items: center; white-space: nowrap; }
  .news.loud .txt { background: var(--news-strip); color: #111; font-weight: 700; justify-content: flex-start; text-align: left; }
  .news.show { animation: wipe .5s var(--ease-out); }
  .news.show.loud .txt { animation: wipe .6s .08s var(--ease-out) backwards; }
  @keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  .dice { display: flex; gap: calc(var(--u) * 2); }
  .die { width: calc(var(--u) * 8); height: calc(var(--u) * 8); border-radius: 18%; background: #fffdf6;
    border: 1px solid #d8c8a3; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 14%;
    box-shadow: 0 5px 12px rgba(42, 27, 16, .3), inset 0 -4px 0 rgba(42, 27, 16, .08); }
  .die i { width: 72%; height: 72%; place-self: center; border-radius: 50%; background: var(--oxblood); opacity: 0; }
  .die i.on { opacity: 1; }
  .die.rolling { animation: tumble .16s linear infinite; }
  .die.rolling:nth-child(2) { animation-direction: reverse; }
  .die.land { animation: settle .35s var(--ease-out); }
  @keyframes tumble { 0% { transform: rotate(0) translateY(0); } 50% { transform: rotate(180deg) translateY(-6%); } 100% { transform: rotate(360deg) translateY(0); } }
  @keyframes settle { from { transform: scale(1.18) rotate(-8deg); } to { transform: scale(1) rotate(0); } }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 2.6em; }
  .actions .btn { font-size: 1.1em; }
  #deed:empty { display: none; }
  #deed { width: min(100%, calc(var(--u) * 34)); }

  .deed { width: 100%; background: #fffdf6;
    border-radius: 6px; overflow: hidden; box-shadow: 0 8px 22px rgba(42, 27, 16, .28);
    animation: deal .35s var(--ease-out); font-size: .92em; }
  @keyframes deal { from { transform: translateY(8px) rotate(-1.5deg); opacity: .5; } to { transform: none; opacity: 1; } }
  .deed header { background: var(--g, var(--oxblood)); color: #fff; padding: .6em .8em; text-align: center; }
  .deed header small { display: block; font: 600 .78em Oswald, sans-serif; letter-spacing: .08em; text-transform: uppercase; opacity: .9; }
  .deed header b { display: block; font-size: 1.12em; line-height: 1.2; }
  .deed.light header { color: var(--ink); }
  .deed .rows { padding: .5em .9em; }
  .deed .row { display: flex; justify-content: space-between; gap: 8px; padding: .12em 0; }
  .deed .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 700; }
  .deed .row.now { color: var(--oxblood); }
  .deed .owner { padding: .45em .9em; border-top: 1px dashed #d8c8a3; display: flex; align-items: center; gap: 6px; font-weight: 700; }
  .deed .owner i { width: .85em; height: .85em; border-radius: 50%; background: var(--c); display: inline-block; }
  .deed .tools { display: flex; gap: 6px; padding: 0 .9em .8em; flex-wrap: wrap; justify-content: center; }
  .deed .tools .btn { font-size: .9em; padding: .4em .8em; }
  .deed .desc { padding: .8em .9em; color: var(--ink-soft); }

  /* ---------- panel ---------- */
  .panel { width: var(--panel-w); height: var(--bs); flex: none; display: flex; flex-direction: column; gap: 14px;
    background: var(--night-2); border: 1px solid #3d2c20; border-radius: 10px; padding: 16px; min-height: 0; }
  .players { display: flex; flex-direction: column; gap: 8px; }
  .player { border-radius: 8px; padding: 9px 11px; background: var(--night-3); border: 1px solid transparent;
    transition: border-color .2s, background-color .2s; }
  .player.active { border-color: var(--gold); background: #35251b; }
  .player.out { opacity: .4; }
  .player .top { position: relative; display: flex; align-items: center; gap: 8px; }
  .player .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.8); }
  .player .name { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player .st { color: var(--muted); display: inline-flex; gap: 4px; align-items: center; font-size: 13px; }
  .money { position: relative; font: 600 17px Oswald, sans-serif; font-variant-numeric: tabular-nums; color: var(--gold-hi); }
  .money.up { color: #9be29b; } .money.down { color: #ff9a8a; }
  .chip { position: absolute; right: 0; top: -16px; font: 700 14px Oswald, sans-serif; pointer-events: none;
    animation: rise 1.1s var(--ease-out) forwards; white-space: nowrap; }
  .chip.up { color: #9be29b; } .chip.down { color: #ff9a8a; }
  @keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }
  .deeds { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 7px; }
  .deeds button { width: 18px; height: 18px; border-radius: 3px; padding: 0; background: var(--g);
    border: 1px solid rgba(255,255,255,.25); position: relative; }
  .deeds button.mort { background: repeating-linear-gradient(135deg, var(--g) 0 3px, transparent 3px 6px); }
  .deeds button b { position: absolute; inset: 0; font: 700 11px/16px Oswald, sans-serif; color: #fff; text-shadow: 0 1px 2px #000; }
  .journal { flex: 1; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid #3d2c20; padding-top: 10px; }
  .journal h2 { margin: 0 0 6px; font: 600 13px Oswald, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .journal ol { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; font-size: 13px; color: var(--muted); }
  .journal li { padding: 3px 0; border-bottom: 1px solid #2c2019; }
  .journal li:first-child { color: var(--text); }
  .journal li.turnline { color: var(--gold); font-weight: 700; }
  .panel footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .switch input { accent-color: var(--gold); }

  /* ---------- narrow screens: stack ---------- */
  @media (max-width: 900px) {
    :root { --bs: calc(100vw - 2 * var(--gap)); }
    body { overflow: auto; }
    .game { flex-direction: column; height: auto; }
    .panel { width: var(--bs); height: auto; }
    .journal ol { max-height: 240px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .die.rolling, .die.land, .token.active::after, .bars.drop { animation: none; }
    .news.show, .news.show.loud .txt, .who.change { animation: fade .3s ease-out; }
    .stamp { animation: fade 1.1s ease-out reverse forwards; transform: translate(-50%, -50%) rotate(-14deg); }
    .deed, .journal li:first-child, .cell .bar svg { animation: fade .2s ease-out; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  }
</style>
</head>
<body>

<main id="setup" class="setup">
  <div class="setup-card">
    <h1 class="logo">Mitropoly</h1>
    <p class="tag">Bagă mare, părinte. Statul plătește.</p>
    <div class="seg" role="radiogroup" aria-label="Număr de jucători" id="count">
      <button role="radio" aria-checked="false" data-n="2">2 jucători</button>
      <button role="radio" aria-checked="false" data-n="3">3</button>
      <button role="radio" aria-checked="true" data-n="4">4</button>
    </div>
    <div id="names"></div>
    <button class="btn primary" id="start">Începe slujba</button>
    <p class="disclaimer">Parodie. Satiră la adresa instituțiilor și a politicienilor, nu a credinței oamenilor.</p>
  </div>
</main>

<main id="game" class="game" hidden>
  <div id="board" class="board">
    <section class="altar">
      <h1 class="logo">Mitropoly</h1>
      <div class="focus">
        <div id="who" class="who" aria-live="polite"></div>
        <div class="dice"><div class="die" id="d0"></div><div class="die" id="d1"></div></div>
        <div id="news" class="news" aria-live="polite"><span class="tag"></span><span class="txt"></span></div>
        <div id="deed"></div>
        <div id="actions" class="actions"></div>
      </div>
    </section>
    <div id="tokens" class="tokens"></div>
  </div>
  <aside class="panel">
    <div id="players" class="players"></div>
    <div class="journal"><h2>Jurnal</h2><ol id="log"></ol></div>
    <footer>
      <label class="switch"><input type="checkbox" id="fast"> Animații rapide</label>
      <span>Parodie</span>
    </footer>
  </aside>
</main>

<script src="mitropoly.js"></script>
</body>
</html>
